<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151412">
  <meta name="description" content="Probable Death or Madness. Listen to the demos.">
  <meta property="og:title" content="Probable Death or Madness">
  <meta property="og:description" content="Listen to the Probable Death or Madness demos.">
  <meta property="og:image" content="https://johnnyerocks.com/pdom-protopunk-3d.jpg">
  <title>Probable Death or Madness</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=flyer-wall-20261121">
  <script src="tracks.js?v=three-demos-20261121" defer></script>
  <script src="site.js?v=download-icons-20261108" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <a class="masthead-mark" href="#top" aria-label="PDOM home">PDOM</a>
    <nav class="overlay-nav" aria-label="Explore the band">
      <button type="button" data-overlay="about" aria-haspopup="dialog"><span>About</span></button>
      <button type="button" data-overlay="members" aria-haspopup="dialog"><span>Members</span></button>
      <button type="button" data-overlay="contact" aria-haspopup="dialog"><span>Contact</span></button>
    </nav>
  </header>

  <main id="main">
    <section class="hero flyer" id="top" aria-labelledby="band-name">
      <div class="flyer-art">
        <h1 id="band-name">
          <img src="pdom-protopunk-3d.jpg" alt="Probable Death or Madness" width="1536" height="1024" fetchpriority="high">
        </h1>
      </div>
      <button class="listen-button" type="button" data-overlay="demos" aria-haspopup="dialog">
        <span aria-hidden="true">▶</span><span>Hear the demos</span>
      </button>
    </section>
  </main>

  <dialog class="site-overlay" id="about-overlay" aria-labelledby="about-title">
    <button class="overlay-close" aria-label="Close about">Close ×</button>
    <div class="overlay-content">
      <h2 id="about-title">About</h2>
      <section class="band-bio" aria-label="About the band">
        <p>Up-and-coming gritty rock band from Helsinki, Finland.</p>
      </section>
    </div>
  </dialog>

  <dialog class="site-overlay" id="members-overlay" aria-labelledby="members-title">
    <button class="overlay-close" aria-label="Close members">Close ×</button>
    <div class="overlay-content">
      <h2 id="members-title">Members</h2>
      <figure class="member-poster" id="johnny-e">
        <img src="johnny-e-tv-yellow.jpg" alt="Johnny E holding a worn TV-yellow Les Paul in a warmly lit studio" width="1086" height="1448" loading="lazy">
        <figcaption><h3 id="johnny-name">Johnny E</h3><p>Guitar</p></figcaption>
      </figure>
    </div>
  </dialog>

  <dialog class="site-overlay paper" id="demos-overlay" aria-labelledby="demos-title">
    <button class="overlay-close" aria-label="Close demos">Close ×</button>
    <div class="overlay-content">
      <section class="demos paper" id="demos" aria-labelledby="demos-title">
        <div class="section-heading"><h2 id="demos-title">Demos</h2></div>
        <div class="tracklist" id="tracklist"></div>
        <noscript><p>Demos coming soon.</p></noscript>
      </section>
    </div>
  </dialog>

  <dialog class="site-overlay" id="contact-overlay" aria-labelledby="contact-title">
    <button class="overlay-close" aria-label="Close contact">Close ×</button>
    <div class="overlay-content">
      <h2 id="contact-title">Contact</h2>
      <p class="contact-email"><a href="mailto:johnnyerocks@outlook.com">johnnyerocks@outlook.com ↗</a></p>
    </div>
  </dialog>

  <button type="button" id="stop-audio" aria-label="Stop audio" title="Stop audio" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/>
      <path d="M16 8c3 2 3 6 0 8m3-11c5 4 5 10 0 14" fill="none" stroke="currentColor" stroke-width="2"/>
    </svg>
  </button>
</body>
</html>
